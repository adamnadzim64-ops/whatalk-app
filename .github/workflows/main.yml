name: Build WhaTalk APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode WhaTalk
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Periksa struktur proyek
        shell: bash
        run: |
          echo "=== DAFTAR FILE ==="
          ls -la
          echo "=== FILE GRADLE ==="
          find . -maxdepth 5 \( \
            -name gradlew -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -print

      - name: Buat debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        shell: bash
        run: |
          set -e

          WRAPPER="$(find . -type f -name gradlew -print -quit)"

          if [ -n "$WRAPPER" ]; then
            chmod +x "$WRAPPER"
            PROJECT_DIR="$(dirname "$WRAPPER")"
            cd "$PROJECT_DIR"
            ./gradlew assembleDebug \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/debug.keystore" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android \
              --stacktrace
          elif [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            gradle assembleDebug \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/debug.keystore" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android \
              --stacktrace
          else
            echo "ERROR: Gradle project tidak ditemukan di folder utama."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WhaTalk-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
