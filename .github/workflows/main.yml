name: Build WhaTalk APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode WhaTalk
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cari file Gradle
        run: |
          echo "Mencari file project..."
          find . -maxdepth 4 \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f app/gradlew ]; then
            cd app
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f app/build.gradle.kts ] || [ -f app/build.gradle ]; then
            gradle -p app assembleDebug
          else
            echo "File Gradle tidak ditemukan di lokasi yang diharapkan."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WhaTalk-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
